<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dock10 HDR Image Inspector</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d333b;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --good:#3fb950; --bad:#f85149; --warn:#d29922; --info:#a371f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  header{padding:22px 28px 6px}
  header h1{margin:0; font-size:20px; font-weight:650; letter-spacing:.2px}
  header p{margin:4px 0 0; color:var(--muted); font-size:13px}
  main{flex:1; display:flex; flex-direction:column; padding:18px 28px 32px; gap:20px; max-width:980px; width:100%; margin:0 auto}

  #drop{
    border:2px dashed var(--border); border-radius:14px;
    background:var(--panel);
    padding:46px 24px; text-align:center; cursor:pointer;
    transition:border-color .15s, background .15s; user-select:none;
  }
  #drop:hover{border-color:var(--accent)}
  #drop.drag{border-color:var(--accent); background:#172033}
  #drop .big{font-size:18px; font-weight:600}
  #drop .sub{color:var(--muted); font-size:13px; margin-top:6px}
  #drop .icon{font-size:34px; line-height:1; margin-bottom:10px; opacity:.85}

  .hidden{display:none !important}

  #verdict{
    border-radius:12px; padding:20px 22px; border:1px solid var(--border);
    background:var(--panel2); font-size:19px; font-weight:650; line-height:1.4;
  }
  #verdict .tag{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.6px;
    text-transform:uppercase; padding:3px 9px; border-radius:999px; margin-bottom:10px;
    background:#21262d; color:var(--muted);
  }
  #verdict.true   {border-color:var(--good)} #verdict.true .tag{background:rgba(63,185,80,.15); color:var(--good)}
  #verdict.wrap   {border-color:var(--warn)} #verdict.wrap .tag{background:rgba(210,153,34,.15); color:var(--warn)}
  #verdict.pqhlg  {border-color:var(--info)} #verdict.pqhlg .tag{background:rgba(163,113,247,.15); color:var(--info)}
  #verdict.sdr    {border-color:var(--bad)}  #verdict.sdr .tag{background:rgba(248,81,73,.15); color:var(--bad)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:20px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px}
  .card h2{margin:0 0 12px; font-size:13px; font-weight:650; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}

  ul.checklist{list-style:none; margin:0; padding:0}
  ul.checklist li{display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px solid #21262d; font-size:14px}
  ul.checklist li:last-child{border-bottom:0}
  .mk{font-weight:700; width:16px; text-align:center; flex:none}
  .mk.y{color:var(--good)} .mk.n{color:var(--bad)}
  .mname{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px}
  .mnote{color:var(--muted); font-size:12px; margin-left:auto}

  table.kv{width:100%; border-collapse:collapse; font-size:14px}
  table.kv td{padding:6px 0; border-bottom:1px solid #21262d; vertical-align:top}
  table.kv tr:last-child td{border-bottom:0}
  table.kv td.k{color:var(--muted); width:46%; padding-right:12px}
  table.kv td.v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-word}
  .muted{color:var(--muted)}
  footer{color:var(--muted); font-size:12px; text-align:center; padding:6px 0 18px}
  #resetWrap{text-align:center}
  button#reset{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  button#reset:hover{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>dock10 HDR Image Inspector</h1>
</header>

<main>
  <div id="drop" tabindex="0" role="button" aria-label="Drop an image or click to choose a file">
    <div class="icon">⤓</div>
    <div class="big">Drop an image here</div>
    <div class="sub">or click to choose a file — JPEG, PNG, WebP, AVIF/HEIC, GIF, TGA</div>
    <input id="file" type="file" class="hidden" accept="image/*,.tga,.avif,.heic,.heif">
  </div>

  <section id="results" class="hidden">
    <div id="verdict"></div>
    <div class="grid" style="margin-top:20px">
      <div class="card">
        <h2>Marker checklist</h2>
        <ul class="checklist" id="checklist"></ul>
      </div>
      <div class="card">
        <h2>Extracted values</h2>
        <table class="kv" id="kv"></table>
      </div>
    </div>
    <div id="resetWrap" style="margin-top:20px">
      <button id="reset">Inspect another file</button>
    </div>
  </section>
</main>

<footer>All processing is local. No uploads, no network calls.</footer>

<script>
"use strict";

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const drop = $("#drop"), fileInput = $("#file"), results = $("#results");
const verdictEl = $("#verdict"), checklistEl = $("#checklist"), kvEl = $("#kv");

function fmtBytes(n){
  if(n < 1024) return n + " B";
  const u = ["KB","MB","GB"]; let i=-1, v=n;
  do { v/=1024; i++; } while(v>=1024 && i<u.length-1);
  return v.toFixed(v<10?2:1) + " " + u[i];
}

/* Decode a Uint8Array to a latin1 string in chunks so a 50MB file
   doesn't blow the call stack or freeze on String.fromCharCode(...all). */
function latin1(bytes){
  const CHUNK = 0x8000; // 32k chars per fromCharCode call
  let out = "";
  for(let i=0; i<bytes.length; i+=CHUNK){
    out += String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
  }
  return out;
}

/* ---------- format detection (magic bytes) ---------- */
function detectFormat(bytes, name){
  const b = bytes, n = (name||"").toLowerCase();
  const u32 = (o)=> (b[o]<<24 | b[o+1]<<16 | b[o+2]<<8 | b[o+3]) >>> 0;
  const ascii = (o,len)=>{ let s=""; for(let i=0;i<len;i++) s+=String.fromCharCode(b[o+i]); return s; };

  if(b.length>=3 && b[0]===0xFF && b[1]===0xD8 && b[2]===0xFF) return "JPEG";
  if(b.length>=8 && b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47) return "PNG";
  if(b.length>=6 && ascii(0,3)==="GIF") return "GIF";
  if(b.length>=12 && ascii(0,4)==="RIFF" && ascii(8,4)==="WEBP") return "WebP";
  if(b.length>=12 && ascii(0,4)==="RIFF") return "RIFF";
  // ISO base media file format: bytes 4..7 == 'ftyp', brand at 8..11
  if(b.length>=12 && ascii(4,4)==="ftyp"){
    const brand = ascii(8,4).trim();
    const heicBrands = ["heic","heix","hevc","heim","heis","mif1","msf1"];
    const avifBrands = ["avif","avis"];
    if(avifBrands.includes(brand)) return "AVIF";
    if(heicBrands.includes(brand)) return "HEIC";
    return "ISO-BMFF ("+brand+")";
  }
  // TGA has no magic — detect by extension, then sanity-check header
  if(n.endsWith(".tga")) return "TGA";
  return null; // unknown — caller still runs marker scan
}

/* JPEG dimensions from SOF0/SOF2 (and other SOFn) markers */
function jpegDimensions(bytes){
  let o = 2; // skip FF D8
  const len = bytes.length;
  while(o < len-1){
    if(bytes[o] !== 0xFF){ o++; continue; }
    let marker = bytes[o+1];
    // skip fill bytes
    while(marker === 0xFF && o+1 < len){ o++; marker = bytes[o+1]; }
    o += 2;
    if(marker === 0xD8 || marker === 0xD9) continue;          // SOI/EOI
    if(marker >= 0xD0 && marker <= 0xD7) continue;            // RST
    if(o+1 >= len) break;
    const segLen = (bytes[o]<<8 | bytes[o+1]);
    // SOF0..SOF15 except DHP(C4),DAC(C8),DNL(CC)
    const isSOF = (marker>=0xC0 && marker<=0xCF) && marker!==0xC4 && marker!==0xC8 && marker!==0xCC;
    if(isSOF && o+7 < len){
      const h = bytes[o+3]<<8 | bytes[o+4];
      const w = bytes[o+5]<<8 | bytes[o+6];
      return {w, h};
    }
    o += segLen; // jump to next marker
  }
  return null;
}

/* TGA header: little-endian width @12, height @14, bit depth @16 */
function tgaInfo(bytes){
  if(bytes.length < 18) return null;
  const w = bytes[12] | (bytes[13]<<8);
  const h = bytes[14] | (bytes[15]<<8);
  const depth = bytes[16];
  return {w, h, depth};
}

/* ---------- marker scan ---------- */
function scanMarkers(str){
  const has = needle => str.indexOf(needle) !== -1;
  return {
    hdrgm:        has("hdrgm"),
    GainMap:      has("GainMap"),
    GContainer:   has("GContainer") || has("Container"),
    MPF:          has("MPF␀"),          // exact MPF NUL, not bare MPF
    iso21496:     has("urn:iso:std:iso:21496"),
    HDRGainMap:   has("HDRGainMap"),
  };
}

/* ---------- XMP / transfer extraction ---------- */
function extractXmp(str){
  const out = {};
  const grab = re => { const m = str.match(re); return m ? m[1] : null; };

  out.version        = grab(/hdrgm:Version\s*=\s*["']([^"']+)["']/);
  // HDRCapacityMax can appear as attribute or element form
  out.capacityMax    = grab(/HDRCapacityMax\s*=\s*["']([-+0-9.eE]+)["']/) ||
                       grab(/<hdrgm:HDRCapacityMax>\s*([-+0-9.eE]+)\s*<\/hdrgm:HDRCapacityMax>/);
  out.gainMapMax     = grab(/GainMapMax\s*=\s*["']([-+0-9.eE]+)["']/) ||
                       grab(/<hdrgm:GainMapMax>\s*([-+0-9.eE]+)\s*<\/hdrgm:GainMapMax>/);

  // transfer hints
  out.st2084 = /ST2084|SMPTE2084/.test(str);
  out.hlg    = /\bHLG\b/.test(str) || str.indexOf("HLG") !== -1;
  out.pq     = str.indexOf("PQ") !== -1; // weak — two letters false-positive easily
  return out;
}

/* ---------- verdict ladder ---------- */
function decideVerdict(fmt, markers, xmp){
  const gainPresent = markers.hdrgm || markers.GainMap;
  const cap = xmp.capacityMax !== null ? parseFloat(xmp.capacityMax) : NaN;
  const capValid = !isNaN(cap) && cap > 0;

  if(gainPresent && capValid){
    const stops = cap;
    const linear = Math.pow(2, cap);
    const stopsTxt = (Math.round(stops*100)/100).toString();
    const linTxt = (linear>=10 ? Math.round(linear) : Math.round(linear*10)/10).toString();
    return {
      cls:"true", tag:"True HDR",
      text:`TRUE HDR — gain map with real headroom (capacity ${stopsTxt}, ≈ ${stopsTxt} stops / ~${linTxt}× brighter than SDR white).`
    };
  }
  if(gainPresent){
    return {
      cls:"wrap", tag:"HDR wrapper",
      text:"HDR-format wrapper — carries a gain map but declares no headroom (likely a demo/placeholder or a stripped file)."
    };
  }
  // PQ/HLG transfer clearly present — strong markers only (bare PQ is weak)
  if(xmp.st2084 || xmp.hlg){
    return { cls:"pqhlg", tag:"PQ / HLG", text:"HDR (PQ/HLG transfer)." };
  }
  if(fmt === "TGA"){
    return { cls:"sdr", tag:"SDR", text:"SDR — this format can't carry HDR." };
  }
  return { cls:"sdr", tag:"SDR", text:"SDR — no gain map or HDR metadata found." };
}

/* ---------- rendering ---------- */
function renderChecklist(markers, xmp){
  const rows = [
    ["hdrgm", markers.hdrgm, "Adobe/ISO gain-map XMP namespace"],
    ["GainMap", markers.GainMap, "gain-map container item"],
    ["GContainer / Container", markers.GContainer, "Google container"],
    ["MPF\\0", markers.MPF, "multi-picture (exact MPF NUL)"],
    ["urn:iso:std:iso:21496", markers.iso21496, "ISO 21496-1 gain map"],
    ["HDRGainMap", markers.HDRGainMap, "Apple"],
    ["ST2084 / SMPTE2084", xmp.st2084, "PQ transfer (strong)"],
    ["HLG", xmp.hlg, "HLG transfer (strong)"],
    ["PQ", xmp.pq, "weak — informational only"],
  ];
  checklistEl.innerHTML = rows.map(([name,found,note])=>`
    <li>
      <span class="mk ${found?'y':'n'}">${found?'✓':'✗'}</span>
      <span class="mname">${name}</span>
      <span class="mnote">${note}</span>
    </li>`).join("");
}

function renderKV(info){
  const rows = [];
  const add = (k,v)=> rows.push([k, v==null||v==="" ? '<span class="muted">—</span>' : v]);
  add("File name", info.name);
  add("File size", fmtBytes(info.size));
  add("Format", info.fmt || '<span class="muted">unknown</span>');
  add("Dimensions", info.dims ? `${info.dims.w} × ${info.dims.h} px${info.dimsSrc?` <span class="muted">(${info.dimsSrc})</span>`:""}` : null);
  add("Bit depth", info.depth!=null ? info.depth+" bpp" : null);
  add("hdrgm:Version", info.xmp.version);
  add("HDRCapacityMax", info.xmp.capacityMax);
  add("hdrgm:GainMapMax", info.xmp.gainMapMax);
  kvEl.innerHTML = rows.map(([k,v])=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("");
}

/* ---------- main pipeline ---------- */
async function inspect(file){
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const str = latin1(bytes);

  const fmt = detectFormat(bytes, file.name);
  const markers = scanMarkers(str);
  const xmp = extractXmp(str);

  // dimensions + depth
  let dims = null, dimsSrc = "", depth = null;
  if(fmt === "JPEG"){ dims = jpegDimensions(bytes); if(dims) dimsSrc = "SOF marker"; }
  else if(fmt === "TGA"){
    const t = tgaInfo(bytes);
    if(t){ dims = {w:t.w, h:t.h}; dimsSrc = "TGA header"; depth = t.depth; }
  }
  if(!dims){
    try{
      const bmp = await createImageBitmap(file);
      dims = {w:bmp.width, h:bmp.height}; dimsSrc = "decoded";
      bmp.close && bmp.close();
    }catch(e){ /* leave dims null */ }
  }

  const verdict = decideVerdict(fmt, markers, xmp);

  // render
  verdictEl.className = verdict.cls;
  verdictEl.innerHTML = `<span class="tag">${verdict.tag}</span><div>${verdict.text}</div>`;
  renderChecklist(markers, xmp);
  renderKV({ name:file.name, size:file.size, fmt, dims, dimsSrc, depth, xmp });

  drop.classList.add("hidden");
  results.classList.remove("hidden");
}

/* ---------- wiring ---------- */
function handleFiles(files){
  if(files && files.length) inspect(files[0]);
}
drop.addEventListener("click", ()=> fileInput.click());
drop.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); }});
fileInput.addEventListener("change", e=> handleFiles(e.target.files));

["dragenter","dragover"].forEach(ev=>
  drop.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(ev=>
  drop.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e=> handleFiles(e.dataTransfer.files));

// allow dropping anywhere on the page once results are showing
window.addEventListener("dragover", e=> e.preventDefault());
window.addEventListener("drop", e=>{ e.preventDefault(); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

$("#reset").addEventListener("click", ()=>{
  results.classList.add("hidden");
  drop.classList.remove("hidden");
  fileInput.value = "";
});
</script>
</body>
</html>
